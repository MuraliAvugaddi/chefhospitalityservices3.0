# Optimized memory settings to prevent JVM crashes
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX and Jetifier are required for modern Flutter plugins
android.useAndroidX=true
android.enableJetifier=true

# Improves build speed by performing incremental compilation
kotlin.incremental=true